version: "3.9"

networks:
  sso-net:
    external: true
    name: sso-lab_sso-net
  dev-net:
    external: true
    name: dev-net

volumes:
  # Fichiers déposés par les utilisateurs (blobs, cf. api/models.py). Déclaré
  # 'external' pour survivre à `clean2.sh storage` (down --volumes) — à créer
  # une fois manuellement avant le premier déploiement :
  #   docker volume create storage-media
  storage-media:
    external: true
    name: storage_storage-media

services:

  backend:
    build: ./backend
    container_name: storage-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8093:8000"
    networks:
      - sso-net
      - dev-net
    volumes:
      - storage-media:/app/media
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/storage-api/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 8000}}"

  frontend:
    build: ./frontend
    container_name: storage-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "4211:80"
    networks:
      - sso-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/storage/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"
