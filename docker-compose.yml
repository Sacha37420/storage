version: "3.9"

networks:
  sso-net:
    external: true
    name: sso-lab_sso-net
  dev-net:
    external: true
    name: dev-net

volumes:
  # Fichiers déposés par les utilisateurs (blobs, cf. api/models.py). Possédé
  # par infra/docker-compose.yml — comme dev-net ci-dessus — pas par cette app :
  # storage est le point d'entrée unique (API) du stockage de fichiers partagé
  # du lab, au même titre que postgres/postgis pour les bases (voir CLAUDE.md,
  # section « Fichiers rasters / médias »). Créé automatiquement au premier
  # `docker compose up` de infra, jamais par cette app.
  storage-media:
    external: true
    name: infra_storage-media

services:

  backend:
    build: ./backend
    container_name: storage-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8093:8000"
    networks:
      - sso-net
      - dev-net
    volumes:
      - storage-media:/app/media
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/storage-api/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 8000}}"

  frontend:
    build: ./frontend
    container_name: storage-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "4211:80"
    networks:
      - sso-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/storage/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"
